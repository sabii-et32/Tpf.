<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="tpf.inicio.css">
</head>
<body>

    <div class="Nombre">
        <h1>Iniciar sesión</h1>

        <form onsubmit="guardarNombre(event)">
            <div>
                <label for="nombre">Ingresa tu nombre y tu apellido aquí 👉🏾</label>

                <input type="text" id="nombre" name="nombre"
                placeholder="Ingresa tu nombre" required>
            </div>
            <h1> </h1>
            <div class="buttondeinicio">
                <button type="submit">¡Comenzar cuestionario!</button>
            </div>
        </form>
    </div>

    <script src="tpf.inicio.js"></script>

</body>
</html>
